name: Android build

# Every push to main (and every PR into main) is verified: analyze, test, build the APK.
# A push to `release` builds the same way and publishes a GitHub release, but only for a
# commit whose main run passed. To release: push to main, wait for its run to pass, then
# fast-forward `release` to that commit and push it.
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Newer pushes to main supersede older checks; release builds always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

permissions:
  contents: write
  actions: read

env:
  # Pinned so a new stable Flutter (and its Android toolchain minimums) cannot break a
  # release unannounced. Bump it on main together with android/ (Gradle, AGP, Kotlin).
  FLUTTER_VERSION: '3.50.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Release only what passed on main
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch main \
            --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Commit $GITHUB_SHA has no successful main run (got '${conclusion:-none}'). Push it to main and wait for it to pass first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Set up release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key, so installing a newer build over an older one needs an uninstall first."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          name="ezdihar_remote_v${version}_build${{ github.run_number }}_${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Built \`$name\` ($(du -h "dist/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          retention-days: ${{ github.ref == 'refs/heads/release' && 30 || 7 }}

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "dist/${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.apk.outputs.tag }}" \
            --generate-notes
          echo "Released [${{ steps.apk.outputs.tag }}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${{ steps.apk.outputs.tag }})." >> "$GITHUB_STEP_SUMMARY"
