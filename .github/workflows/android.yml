name: Android build

# Every push to main (and every PR into main) is verified: analyze, test, build the APK.
# A passing main push also replaces the "main-latest" pre-release with its APK.
# A push to `release` builds the same way and publishes a GitHub release, but only for a
# commit whose main run passed. To release: push to main, wait for its run to pass, then
# fast-forward `release` to that commit and push it. All APKs are signed with the debug
# key committed at android/app/debug.keystore (the app is never published).
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Newer pushes to main supersede older checks; release builds always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

permissions:
  contents: write
  actions: read

env:
  # Pinned so a new stable Flutter (and its Android toolchain minimums) cannot break a
  # release unannounced. Bump it on main together with android/ (Gradle, AGP, Kotlin).
  FLUTTER_VERSION: '3.50.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Release only what passed on main
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch main \
            --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Commit $GITHUB_SHA has no successful main run (got '${conclusion:-none}'). Push it to main and wait for it to pass first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Signed with the debug key committed at android/app/debug.keystore (the app is
      # never published), so every build installs over the previous one.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          name="ezdihar_remote_v${version}_build${{ github.run_number }}_${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Built \`$name\` ($(du -h "dist/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          retention-days: ${{ github.ref == 'refs/heads/release' && 30 || 7 }}

      # Every passing main build replaces the single "main-latest" pre-release, so the
      # newest main APK is always one click away at .../releases/tag/main-latest (no
      # login, no zip). It is a pre-release and never marked Latest; real releases stay apart.
      - name: Publish latest main build
        # Also on "Run workflow": the way to republish after a failed publish.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete main-latest --cleanup-tag --yes || true
          gh release create main-latest "dist/${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Latest main build (build ${{ github.run_number }}, ${GITHUB_SHA::7})" \
            --notes "Newest APK from main (passed analyze + test), commit $GITHUB_SHA, signed with the shared debug key. Replaced on every main push; numbered releases are the other tags."
          echo "Latest main APK: [main-latest]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/main-latest)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "dist/${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.apk.outputs.tag }}" \
            --generate-notes
          echo "Released [${{ steps.apk.outputs.tag }}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${{ steps.apk.outputs.tag }})." >> "$GITHUB_STEP_SUMMARY"
